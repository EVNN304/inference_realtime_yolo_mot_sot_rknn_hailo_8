[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gimb"
version = "0.2.0"
description = "Embedded YOLO, HybridSORT and NanoTrack pipeline for Hailo-8 and RK3588"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "boxmot*"]
namespaces = true

[tool.setuptools.package-data]
boxmot = ["configs/*.yaml", "reid/backbones/clip/clip/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests/hailo_backend"]
pythonpath = [".", "tests/hailo_backend"]
